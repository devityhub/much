# Deploy permanente: https://fly.io — URL estável https://<app>.fly.dev
#   fly auth login
#   npm run deploy:fly

app = "passtime"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DB_PATH = "/data/streamflix.db"
  UPLOADS_DIR = "/data/uploads"
  MAX_PEERS_PER_ROOM = "6"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"

[[mounts]]
  source = "passtime_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
